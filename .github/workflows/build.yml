name: Build en push images

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build en push web-app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build en push PEP-downloader image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.downloader
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-downloader:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}-downloader:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
