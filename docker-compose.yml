services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PEP_DATA_DIR=/data/pep
      - OPENSANCTIONS_API_KEY=${OPENSANCTIONS_API_KEY:-}
    volumes:
      - pep-data:/data/pep
    restart: unless-stopped

  pep-downloader:
    build:
      context: .
      dockerfile: Dockerfile.downloader
    command: ["--interval", "168"]
    environment:
      - PEP_DATA_DIR=/data/pep
    volumes:
      - pep-data:/data/pep
    restart: unless-stopped

volumes:
  pep-data:
